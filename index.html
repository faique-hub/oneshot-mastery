<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Shot Mastery</title>
  <!-- Website & Mobile App Icons -->
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="manifest.json">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- HEADER -->
  <header>
    <!-- Mobile Menu Button -->
    <button class="hamburger" id="hamburgerBtn" title="Subjects">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <!-- Website Logo -->
    <div class="brand">
      <div class="mark">Revise<span class="dot">.</span></div>
      <div class="tag">Class 10 exam vault</div>
    </div>
    <!-- Search Bar -->
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="#8A93A8" stroke-width="2"/>
        <path d="M21 21l-4-4" stroke="#8A93A8" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="searchInput" placeholder="Search study materials...">
      <div class="search-results" id="searchResults" style="display:none;"></div>
    </div>
    <!-- Website Stats -->
    <div class="header-stats">
      <div class="hstat">
        <div class="n" id="statTotal">0</div>
        <div class="l">PDFs</div>
      </div>
      <div class="hstat">
        <div class="n" id="statSubjects">0</div>
        <div class="l">Subjects</div>
      </div>
    </div>
  </header>
  <!-- MAIN LAYOUT -->
  <div class="layout">
    <!-- Mobile Sidebar Background -->
    <div class="sidebar-scrim" id="sidebarScrim"></div>
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebarClose">&times;</button>
      <div class="sidebar-title">Subjects</div>
      <!-- Subjects will be added by JavaScript -->
      <div class="subject-list" id="subjectList"></div>
    </aside>
    <!-- MAIN CONTENT -->
    <main class="main">
      <!-- Subject Name -->
      <div class="subject-header">
        <div>
          <h1 id="subjectTitle">—</h1>
          <div class="sub" id="subjectSub"></div>
        </div>
      </div>
      <!-- Category Buttons -->
      <div class="tabs" id="categoryTabs"></div>
      <!-- PDF Cards -->
      <div class="cards-grid" id="cardsGrid"></div>
    </main>
  </div>
<!-- FOOTER -->
<footer class="site-footer">

  <div class="footer-socials">
    <a href="https://www.instagram.com/oneshot_mastery" target="_blank" rel="noopener noreferrer">
      Instagram
    </a>

    <span>|</span>

    <a href="https://youtube.com/@oneshotmastery-e9r?si=LLj25vnBd7JOywKU" target="_blank" rel="noopener noreferrer">
      YouTube
    </a>
  </div>

  <p>© 2026 One Shot Mastery. All Rights Reserved.</p>
  <p>Designed &amp; Developed by Shah Faique</p>
</footer>
  <!-- PDF Preview Popup -->
  <div id="modalRoot"></div>
  <!-- JAVASCRIPT -->
  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
